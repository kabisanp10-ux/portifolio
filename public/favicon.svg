<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C778"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
    <radialGradient id="navyBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </radialGradient>
  </defs>
  <!-- Background Shape -->
  <rect width="64" height="64" rx="16" fill="url(#navyBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Gold Monogram K -->
  <text x="32" y="44" font-family="'Syne', 'Outfit', sans-serif" font-size="34" font-weight="800" fill="url(#goldGrad)" text-anchor="middle">K</text>
</svg>
